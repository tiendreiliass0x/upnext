# Single-instance by design. The vote counts live in a SQLite file on the
# volume below, and the upload concurrency limiter is an in-process Set, so a
# second replica would split the limiter and corrupt the counts. Do not scale
# this service.

services:
  app:
    # CI builds and pushes this image; deploy/rollout.sh pins the tag in .env.
    # `build` stays so provision.sh (and a laptop) can still build it locally,
    # tagged under the same name.
    image: ghcr.io/tiendreiliass0x/upnext:${UPNEXT_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever .env says, so the database always lands on the volume.
      SQLITE_PATH: /data/dj-booth.sqlite
      # Cleanup's last-success/last-failure markers must outlive the container,
      # or --status reports "never" after every redeploy.
      UPNEXT_CLEANUP_STATE: /data/cleanup-state
    volumes:
      - upnext-data:/data
    # No published port: Caddy is the only way in.
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/sessions/HEALTH').then(r=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # e.g. SITE_ADDRESS=203-0-113-4.sslip.io  (or your domain once you have one)
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  upnext-data:
  caddy-data:
  caddy-config:
